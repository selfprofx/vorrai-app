<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Vorrai - Pre-Triage Console</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- <link rel="icon" type="image/x-icon" href="favicon.ico"> -->

  <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
  <!-- <link rel="manifest" href="/site.webmanifest"> -->

  <!-- Vorrai Clinical — Brand Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700&display=swap" rel="stylesheet">

</head>
<body>
  <script>
    // Vorrai Clinical defaults to LIGHT theme (Marble White surfaces).
    // The dark theme is still available — clinic users can toggle via settings,
    // and the choice is persisted in localStorage under 'vorrai-theme'.
    // For backward compat we honour the legacy 'vendia-theme' key as a fallback.
    (function() {
      var t = localStorage.getItem('vorrai-theme') || localStorage.getItem('vendia-theme');
      if (!t) t = 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <app-root></app-root>
</body>
</html>
