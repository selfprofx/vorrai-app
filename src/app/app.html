<nb-layout windowMode>

<nb-layout-header *ngIf="auth.isAuthenticated()" fixed class="header-container">
    <div class="header-left">
      <button nbButton ghost (click)="toggleSidebar()">☰</button>
      <img src="assets/logo.png" alt="Vendia Logo" class="logo">
    </div>

    <div class="header-right">
      <button class="theme-toggle" (click)="onThemeToggle()" [attr.aria-label]="themeLabel()">
        <nb-icon [icon]="themeIcon()"></nb-icon>
      </button>
      <nb-user
        [name]="displayName()"
        [title]="auth.isManager() ? 'Manager' : 'Tenant Admin'"
        [nbContextMenu]="topMenuItems"
        nbContextMenuTag="profile-menu">
      </nb-user>
    </div>
</nb-layout-header>

  <!-- Sidebar / lateral menu -->
  <nb-sidebar *ngIf="auth.isAuthenticated()" tag="menu-sidebar" state="expanded" responsive>
    <nb-menu [items]="menuItems()"></nb-menu>
  </nb-sidebar>

  <!-- Main content -->
  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>

</nb-layout>

<!-- AI Assistant widget — fixed bottom-right, always visible when authenticated -->
<app-ai-assistant />
