<nb-layout windowMode>

<nb-layout-header fixed class="header-container">
    <div class="header-left">
      <button nbButton ghost (click)="toggleSidebar()">☰</button>
      <img src="assets/logo.png" alt="Vendia Logo" class="logo">
    </div>

    <div class="header-right">
      <nb-user
        name="Username"
        title="title"
        [nbContextMenu]="topMenuItems"
        nbContextMenuTag="profile-menu"> 
      </nb-user>
    </div>
</nb-layout-header>



  <!-- Sidebar / lateral menu -->
  <nb-sidebar tag="menu-sidebar" state="compacted" responsive>
    <nb-menu [items]="menuItems()"></nb-menu>
  </nb-sidebar>

  <!-- Main content -->
  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>

</nb-layout>

<!-- AI Assistant widget — fixed bottom-right, always visible when authenticated -->
<app-ai-assistant />
