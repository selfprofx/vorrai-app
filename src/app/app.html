<div class="app-shell" [class.ai-pinned]="aiChat.isPinned() && aiChat.isOpen()">

<nb-layout>

<nb-layout-header *ngIf="auth.isAuthenticated()" fixed class="header-container">
    <div class="header-left">
      <button class="sidebar-toggle" (click)="toggleSidebar()">
        <nb-icon icon="menu-outline"></nb-icon>
      </button>
      <a routerLink="/dashboard" class="logo-link">
        <img src="assets/vorrai-monogram.svg" alt="" class="logo-monogram">
        <span class="logo-wordmark">Vorrai</span>
      </a>
    </div>

    <div class="header-right">
      <app-notification-bell></app-notification-bell>
      <nb-user
        [name]="displayName()"
        [title]="auth.isManager() ? 'Manager' : 'Tenant Admin'"
        [nbContextMenu]="topMenuItems"
        nbContextMenuTag="profile-menu">
      </nb-user>
    </div>
</nb-layout-header>

  <!-- Sidebar / lateral menu -->
  <nb-sidebar *ngIf="auth.isAuthenticated()" tag="menu-sidebar" state="expanded">
    <nb-menu [items]="menuItems()"></nb-menu>
  </nb-sidebar>

  <!-- Main content -->
  <nb-layout-column>
    <router-outlet></router-outlet>
  </nb-layout-column>

</nb-layout>

<!-- AI Assistant panel — pinnable right panel -->
<app-ai-assistant />

</div>
