<div class="bell-wrapper" (click)="toggle()">
  <nb-icon icon="bell-outline" class="bell-icon"></nb-icon>
  <span *ngIf="notificationService.unreadCount() > 0" class="badge">
    {{ notificationService.unreadCount() > 9 ? '9+' : notificationService.unreadCount() }}
  </span>
</div>

<div class="dropdown" *ngIf="open()">
  <div class="dropdown-header">
    <span>Notifications</span>
    <button *ngIf="notificationService.unreadCount() > 0"
            class="clear-btn" (click)="onMarkAllRead(); $event.stopPropagation()">
      Mark all read
    </button>
  </div>

  <div class="dropdown-body">
    <div *ngIf="topNotifications.length === 0" class="empty">
      No notifications yet.
    </div>

    <div
      *ngFor="let n of topNotifications"
      class="notif-item"
      [class.unread]="!n.read"
      (click)="onNotificationClick(n)"
    >
      <div class="notif-row">
        <nb-icon [icon]="iconForType(n.type)" class="notif-type-icon"></nb-icon>
        <div class="notif-content">
          <div class="notif-title">{{ n.title }}</div>
          <div class="notif-msg">{{ n.message }}</div>
          <div class="notif-time">{{ formatTime(n.timestamp) }}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="dropdown-footer">
    <button class="footer-btn" (click)="onSettingsClick(); $event.stopPropagation()">
      <nb-icon icon="settings-2-outline"></nb-icon>
    </button>
    <button class="footer-btn footer-btn--link" (click)="onShowAllClick(); $event.stopPropagation()">
      Show all
    </button>
  </div>
</div>
