<div class="auth-page">
  <div class="auth-container">

    <div class="auth-brand">
      <img src="assets/vorrai-monogram.svg" alt="" class="auth-monogram">
      <img src="assets/vorrai-wordmark.svg" alt="Vorrai" class="auth-wordmark">
    </div>

    <nb-card class="auth-card">
      <nb-card-header>
        <h2>{{ 'auth.forgot.title' | translate }}</h2>
        <p class="auth-subtitle">{{ 'auth.forgot.subtitle' | translate }}</p>
      </nb-card-header>

      <nb-card-body>
        <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">

          <div class="form-group">
            <label class="form-label" for="email">{{ 'auth.signIn.emailLabel' | translate }}</label>
            <input
              nbInput
              fullWidth
              id="email"
              name="email"
              type="email"
              [placeholder]="'auth.signIn.emailPlaceholder' | translate"
              [(ngModel)]="email"
              required
              autocomplete="email"
            />
          </div>

          <app-turnstile
            action="forgot_password"
            (token)="onCaptcha($event)"
            (expired)="onCaptchaExpired()"
          ></app-turnstile>

          @if (error()) {
            <div class="auth-error">⚠ {{ error() }}</div>
          }

          <button
            nbButton
            status="primary"
            fullWidth
            type="submit"
            class="auth-submit"
            [disabled]="loading() || !email || !captchaToken()"
          >
            {{ (loading() ? 'auth.forgot.submitting' : 'auth.forgot.submit') | translate }}
          </button>
        </form>

        <p class="auth-footer-link">
          <a routerLink="/auth/login">{{ 'auth.forgot.backToLogin' | translate }}</a>
        </p>
      </nb-card-body>
    </nb-card>

  </div>
</div>
