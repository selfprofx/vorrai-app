<div class="auth-page">
  <div class="auth-container">

    <div class="auth-brand">
      <img src="assets/vorrai-wordmark.svg" alt="Vorrai">
      <span class="auth-tagline">{{ 'auth.tagline' | translate }}</span>
    </div>

    <nb-card class="auth-card">
      <nb-card-header>
        <h2>{{ 'auth.mfa.title' | translate }}</h2>
        <p class="auth-subtitle">{{ 'auth.mfa.subtitle' | translate }}</p>
      </nb-card-header>

      <nb-card-body>
        <form (ngSubmit)="onSubmit()" #form="ngForm">

          <div class="form-group">
            <label class="form-label" for="code">{{ 'auth.mfa.codeLabel' | translate }}</label>
            <input
              nbInput
              fullWidth
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              placeholder="000 000"
              maxlength="7"
              [(ngModel)]="code"
              required
              class="otp-input"
            />
            <small class="form-hint">{{ 'auth.mfa.hint' | translate }}</small>
          </div>

          @if (error()) {
            <div class="auth-error">⚠ {{ error() }}</div>
          }

          <button
            nbButton
            status="primary"
            fullWidth
            type="submit"
            class="auth-submit"
            [disabled]="loading() || code.length < 6"
          >
            {{ (loading() ? 'auth.mfa.submitting' : 'auth.mfa.submit') | translate }}
          </button>

        </form>
      </nb-card-body>
    </nb-card>

  </div>
</div>
