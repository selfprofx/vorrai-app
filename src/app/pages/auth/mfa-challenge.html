<div class="auth-page">
  <div class="auth-container">

    <div class="auth-brand">
      <img src="assets/logo.png" alt="Vendia">
      <span class="auth-tagline">The Authority Engine</span>
    </div>

    <nb-card class="auth-card">
      <nb-card-header>
        <h2>Two-Factor Authentication</h2>
        <p class="auth-subtitle">Open your authenticator app and enter the 6-digit code.</p>
      </nb-card-header>

      <nb-card-body>
        <form (ngSubmit)="onSubmit()" #form="ngForm">

          <div class="form-group">
            <label class="form-label" for="code">Authentication Code</label>
            <input
              nbInput
              fullWidth
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              placeholder="000 000"
              maxlength="7"
              [(ngModel)]="code"
              required
              class="otp-input"
            />
            <small class="form-hint">6-digit code from Google Authenticator, Authy, or similar app.</small>
          </div>

          @if (error()) {
            <div class="auth-error">⚠ {{ error() }}</div>
          }

          <button
            nbButton
            status="primary"
            fullWidth
            type="submit"
            class="auth-submit"
            [disabled]="loading() || code.length < 6"
          >
            {{ loading() ? 'Verifying…' : 'Verify & Sign In' }}
          </button>

        </form>
      </nb-card-body>
    </nb-card>

  </div>
</div>
