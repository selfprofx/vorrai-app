<div class="auth-page">
  <div class="auth-container">

    <!-- Brand Mark -->
    <div class="auth-brand">
      <img src="assets/vorrai-wordmark.svg" alt="Vorrai">
      <span class="auth-tagline">{{ 'auth.tagline' | translate }}</span>
    </div>

    <!-- New Password Card -->
    <nb-card class="auth-card">
      <nb-card-header>
        <h2>{{ 'auth.newPassword.title' | translate }}</h2>
        <p class="auth-subtitle">{{ 'auth.newPassword.subtitle' | translate }}</p>
      </nb-card-header>

      <nb-card-body>
        <p class="auth-hint">{{ 'auth.newPassword.hint' | translate }}</p>

        <form (ngSubmit)="onSubmit()" #form="ngForm">

          <div class="form-group">
            <label class="form-label">{{ 'auth.newPassword.passwordLabel' | translate }}</label>
            <input
              nbInput
              fullWidth
              type="password"
              placeholder="••••••••"
              [(ngModel)]="password"
              name="password"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="form-group">
            <label class="form-label">{{ 'auth.newPassword.confirmLabel' | translate }}</label>
            <input
              nbInput
              fullWidth
              type="password"
              placeholder="••••••••"
              [(ngModel)]="confirmPassword"
              name="confirm"
              required
              autocomplete="new-password"
            />
          </div>

          @if (error()) {
            <div class="auth-error">⚠ {{ error() }}</div>
          }

          <button
            nbButton
            status="primary"
            fullWidth
            type="submit"
            class="auth-submit"
            [disabled]="loading() || !password || !confirmPassword"
          >
            {{ (loading() ? 'auth.newPassword.submitting' : 'auth.newPassword.submit') | translate }}
          </button>

        </form>
      </nb-card-body>
    </nb-card>

  </div>
</div>
