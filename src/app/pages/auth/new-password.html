<div class="auth-page">
  <div class="auth-container">

    <!-- Brand Mark -->
    <div class="auth-brand">
      <img src="assets/vorrai-wordmark.svg" alt="Vorrai">
      <span class="auth-tagline">The Authority Engine</span>
    </div>

    <!-- New Password Card -->
    <nb-card class="auth-card">
      <nb-card-header>
        <h2>Set New Password</h2>
        <p class="auth-subtitle">Your account requires a password to continue.</p>
      </nb-card-header>

      <nb-card-body>
        <p class="auth-hint">
          Choose a strong password of at least 8 characters. You'll use this to sign in going forward.
        </p>

        <form (ngSubmit)="onSubmit()" #form="ngForm">

          <div class="form-group">
            <label class="form-label">New Password</label>
            <input
              nbInput
              fullWidth
              type="password"
              placeholder="••••••••"
              [(ngModel)]="password"
              name="password"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input
              nbInput
              fullWidth
              type="password"
              placeholder="••••••••"
              [(ngModel)]="confirmPassword"
              name="confirm"
              required
              autocomplete="new-password"
            />
          </div>

          @if (error()) {
            <div class="auth-error">⚠ {{ error() }}</div>
          }

          <button
            nbButton
            status="primary"
            fullWidth
            type="submit"
            class="auth-submit"
            [disabled]="loading() || !password || !confirmPassword"
          >
            {{ loading() ? 'Saving…' : 'Set Password & Continue' }}
          </button>

        </form>
      </nb-card-body>
    </nb-card>

  </div>
</div>
