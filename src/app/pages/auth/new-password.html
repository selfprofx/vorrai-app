<div class="login-wrapper">
  <nb-card class="login-card">
    <nb-card-header>
      <h2>Set New Password</h2>
      <p class="subtitle">Your account requires a new password to continue.</p>
    </nb-card-header>

    <nb-card-body>
      <form (ngSubmit)="onSubmit()" #form="ngForm">
        <div class="form-group">
          <label>New Password</label>
          <input nbInput fullWidth type="password" [(ngModel)]="password" name="password" required />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input nbInput fullWidth type="password" [(ngModel)]="confirmPassword" name="confirm" required />
        </div>

        @if (error()) {
          <div class="error-message">{{ error() }}</div>
        }

        <button nbButton status="primary" fullWidth type="submit" [disabled]="loading()">
          {{ loading() ? 'Saving…' : 'Set Password' }}
        </button>
      </form>
    </nb-card-body>
  </nb-card>
</div>
