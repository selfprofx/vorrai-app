<div class="auth-page">
  <div class="auth-container">

    <!-- Brand Mark -->
    <div class="auth-brand">
      <img src="assets/logo.png" alt="Vendia">
      <span class="auth-tagline">The Authority Engine</span>
    </div>

    <!-- Sign-in Card -->
    <nb-card class="auth-card">
      <nb-card-header>
        <h2>Sign In</h2>
        <p class="auth-subtitle">Vendia Dashboard &middot; <strong>app.vendia.vip</strong></p>
      </nb-card-header>

      <nb-card-body>
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              nbInput
              fullWidth
              id="email"
              name="email"
              type="email"
              placeholder="you@yourcompany.com"
              [(ngModel)]="email"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input
              nbInput
              fullWidth
              id="password"
              name="password"
              type="password"
              placeholder="••••••••"
              [(ngModel)]="password"
              required
              autocomplete="current-password"
            />
          </div>

          @if (error()) {
            <div class="auth-error">⚠ {{ error() }}</div>
          }

          <button
            nbButton
            status="primary"
            fullWidth
            type="submit"
            class="auth-submit"
            [disabled]="loading() || !email || !password"
          >
            {{ loading() ? 'Signing in…' : 'Sign In' }}
          </button>

        </form>
      </nb-card-body>
    </nb-card>

  </div>
</div>
