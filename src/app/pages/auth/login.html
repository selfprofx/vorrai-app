<div class="login-wrapper">
  <nb-card class="login-card">
    <nb-card-header>
      <h2>Sign In</h2>
      <p class="subtitle">Vendia Dashboard · <strong>app.vendia.vip</strong></p>
    </nb-card-header>

    <nb-card-body>
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            nbInput
            fullWidth
            id="email"
            name="email"
            type="email"
            placeholder="you@yourcompany.com"
            [(ngModel)]="email"
            required
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            nbInput
            fullWidth
            id="password"
            name="password"
            type="password"
            placeholder="••••••••"
            [(ngModel)]="password"
            required
            autocomplete="current-password"
          />
        </div>

        @if (error()) {
          <div class="error-message">{{ error() }}</div>
        }

        <button
          nbButton
          status="primary"
          fullWidth
          type="submit"
          [disabled]="loading() || !email || !password"
        >
          {{ loading() ? 'Signing in…' : 'Sign In' }}
        </button>
      </form>
    </nb-card-body>
  </nb-card>
</div>
