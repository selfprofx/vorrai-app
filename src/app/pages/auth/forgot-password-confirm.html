<div class="auth-page">
  <div class="auth-container">

    <div class="auth-brand">
      <img src="assets/vorrai-monogram.svg" alt="" class="auth-monogram">
      <img src="assets/vorrai-wordmark.svg" alt="Vorrai" class="auth-wordmark">
    </div>

    <nb-card class="auth-card">
      <nb-card-header>
        <h2>{{ 'auth.forgotConfirm.title' | translate }}</h2>
        <p class="auth-subtitle">{{ 'auth.forgotConfirm.subtitle' | translate }}</p>
      </nb-card-header>

      <nb-card-body>
        <form (ngSubmit)="onSubmit()" #confirmForm="ngForm">

          <div class="form-group">
            <label class="form-label" for="email">{{ 'auth.signIn.emailLabel' | translate }}</label>
            <input
              nbInput
              fullWidth
              id="email"
              name="email"
              type="email"
              [(ngModel)]="email"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="code">{{ 'auth.forgotConfirm.codeLabel' | translate }}</label>
            <input
              nbInput
              fullWidth
              id="code"
              name="code"
              type="text"
              inputmode="numeric"
              [placeholder]="'auth.forgotConfirm.codePlaceholder' | translate"
              [(ngModel)]="code"
              required
              autocomplete="one-time-code"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="password">{{ 'auth.forgotConfirm.newPasswordLabel' | translate }}</label>
            <input
              nbInput
              fullWidth
              id="password"
              name="password"
              type="password"
              placeholder="••••••••"
              [(ngModel)]="password"
              required
              autocomplete="new-password"
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm">{{ 'auth.forgotConfirm.confirmLabel' | translate }}</label>
            <input
              nbInput
              fullWidth
              id="confirm"
              name="confirm"
              type="password"
              placeholder="••••••••"
              [(ngModel)]="confirmPassword"
              required
              autocomplete="new-password"
            />
          </div>

          <app-turnstile
            action="forgot_password_confirm"
            (token)="onCaptcha($event)"
            (expired)="onCaptchaExpired()"
          ></app-turnstile>

          @if (error()) {
            <div class="auth-error">⚠ {{ error() }}</div>
          }

          <button
            nbButton
            status="primary"
            fullWidth
            type="submit"
            class="auth-submit"
            [disabled]="loading() || !email || !code || !password || !confirmPassword || !captchaToken()"
          >
            {{ (loading() ? 'auth.forgotConfirm.submitting' : 'auth.forgotConfirm.submit') | translate }}
          </button>
        </form>

        <p class="auth-footer-link">
          <a routerLink="/auth/login">{{ 'auth.forgot.backToLogin' | translate }}</a>
        </p>
      </nb-card-body>
    </nb-card>

  </div>
</div>
